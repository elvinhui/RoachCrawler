name: Automated Content Pipeline

on:
  schedule:
    # Runs every 6 hours -> 4 articles per day -> 2 articles every 12 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  research_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need permission to push the generated articles

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install local skills (last30days)
        run: npm install
        working-directory: .agents/skills/last30days

      - name: Generate .env from Secrets
        run: |
          echo "SERP_API_KEY=${{ secrets.SERP_API_KEY }}" > .env
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
          # Add any other keys required by last30days engine

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Pipeline (Phase 0 -> Phase 3)
        run: bash pipeline.sh
