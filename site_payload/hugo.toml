baseURL = 'https://www.smartinfralog.com/'
canonifyURLs = true
enableRobotsTXT = true
defaultContentLanguage = 'en'
paginate = 6

[taxonomies]
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  posts = "/posts/:contentbasename/"


[params]
  env = 'production'
  defaultTheme = 'auto'
  ShowPostNavLinks = true

# ================================
# 英文网段配置 (默认路由 /)
# ================================
[languages.en]
  label = "English"
  title = "SmartInfraLog"
  weight = 1

[[languages.en.menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[languages.en.menu.main]]
  name = "About"
  url = "/about/"
  weight = 2

[[languages.en.menu.main]]
  name = "Privacy"
  url = "/privacy/"
  weight = 3

[[languages.en.menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 4

[[languages.en.menu.main]]
  name = "Terms"
  url = "/terms/"
  weight = 5

# ================================
# 中文网段配置 (路由 /zh/)
# ================================
[languages.zh]
  label = "中文"
  title = "SmartInfraLog"
  weight = 2

[[languages.zh.menu.main]]
  name = "首页"
  url = "/zh/"
  weight = 1

[[languages.zh.menu.main]]
  name = "关于"
  url = "/zh/about/"
  weight = 2

[[languages.zh.menu.main]]
  name = "隐私协议"
  url = "/zh/privacy/"
  weight = 3

[[languages.zh.menu.main]]
  name = "联系我们"
  url = "/zh/contact/"
  weight = 4

[[languages.zh.menu.main]]
  name = "服务条款"
  url = "/zh/terms/"
  weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true