baseURL = '/'
defaultContentLanguage = 'zh'
paginate = 6

[outputs]
  home = ["HTML", "RSS", "JSON"]


[params]
  env = 'production'
  defaultTheme = 'auto'
  ShowPostNavLinks = true

# ================================
# 中文网段配置 (默认路由 /)
# ================================
[languages.zh]
  label = "中文"
  title = "SmartInfraLog"
  weight = 1

# ================================
# 英文网段配置 (路由 /en/)
# ================================
[languages.en]
  label = "English"
  title = "SmartInfraLog"
  weight = 2