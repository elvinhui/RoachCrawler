<!DOCTYPE html>
<html lang="{{ .Lang }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Title }} - IT Infrastructure Automation & SEO Platform{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  {{ partial "extend_head.html" . }}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --bg2: #111827;
      --surface: rgba(24, 24, 27, 0.72);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --teal: #14b8a6;
      --teal-glow: rgba(20, 184, 166, 0.85);
      --indigo: #818cf8;
    }

    html { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 clamp(16px, 4vw, 48px);
      height: 60px;
      background: rgba(9, 9, 11, 0.82);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .site-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .site-logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 5px rgba(20, 184, 166, 0.18);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 5px rgba(20, 184, 166, 0.18); }
      50% { box-shadow: 0 0 0 10px rgba(20, 184, 166, 0.05); }
    }

    .site-nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .site-nav-links a {
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: color 180ms, background 180ms;
    }

    .site-nav-links a:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    /* ── MAIN CONTENT ── */
    .site-main {
      min-height: calc(100vh - 60px);
    }

    /* ── FOOTER ── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 28px clamp(16px, 4vw, 48px);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a class="site-logo" href="{{ if eq .Lang "zh" }}/{{ else }}/en/{{ end }}">
    <span class="site-logo-dot"></span>
    InfraOps Router
  </a>
  <div class="site-nav-links">
    <a href="{{ if eq .Lang "zh" }}/posts/{{ else }}/en/posts/{{ end }}">{{ if eq .Lang "zh" }}文章{{ else }}Posts{{ end }}</a>
    {{ if eq .Lang "zh" }}
    <a href="/en/">English</a>
    {{ else }}
    <a href="/">中文</a>
    {{ end }}
  </div>
</nav>

<main class="site-main">
  {{ block "main" . }}{{ end }}
</main>

<footer class="site-footer">
  © {{ now.Year }} InfraOps Router · Automated IT Infrastructure Content Platform
</footer>

</body>
</html>
