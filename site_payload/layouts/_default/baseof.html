<!DOCTYPE html>
<html lang="{{ .Lang }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Title }} - IT Infrastructure Automation & SEO Platform{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  {{ partial "extend_head.html" . }}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --bg2: #111827;
      --surface: rgba(24, 24, 27, 0.72);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --teal: #14b8a6;
      --teal-glow: rgba(20, 184, 166, 0.85);
      --indigo: #818cf8;
    }

    html { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 clamp(16px, 4vw, 48px);
      height: 60px;
      background: rgba(9, 9, 11, 0.82);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .site-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .site-logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 5px rgba(20, 184, 166, 0.18);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 5px rgba(20, 184, 166, 0.18); }
      50% { box-shadow: 0 0 0 10px rgba(20, 184, 166, 0.05); }
    }

    .site-nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .site-nav-links a {
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: color 180ms, background 180ms;
    }

    .site-nav-links a:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    /* ── MAIN CONTENT ── */
    .site-main {
      min-height: calc(100vh - 60px);
    }

    /* ── FOOTER ── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 28px clamp(16px, 4vw, 48px);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    /* ── SEARCH ── */
    .search-container {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      width: 160px;
      transition: width 0.2s ease, background 0.2s ease;
    }
    .search-input:focus {
      outline: none;
      width: 240px;
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--teal);
    }
    .search-input::placeholder {
      color: var(--muted);
    }
    .search-results {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      width: 320px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      max-height: 400px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      z-index: 100;
    }
    .search-results.active {
      display: flex;
    }
    .search-result-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      transition: background 0.2s;
    }
    .search-result-item:last-child {
      border-bottom: none;
    }
    .search-result-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .search-result-title {
      color: var(--teal);
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .search-result-summary {
      color: var(--muted);
      font-size: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .search-empty {
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a class="site-logo" href="{{ if eq .Lang "zh" }}/{{ else }}/en/{{ end }}">
    <span class="site-logo-dot"></span>
    InfraOps Router
  </a>
  <div class="site-nav-links">
    <a href="{{ if eq .Lang "zh" }}/posts/{{ else }}/en/posts/{{ end }}">{{ if eq .Lang "zh" }}文章{{ else }}Posts{{ end }}</a>
    {{ if eq .Lang "zh" }}
    <a href="/en/">English</a>
    {{ else }}
    <a href="/">中文</a>
    {{ end }}
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="{{ if eq .Lang "zh" }}搜索... (Ctrl+K){{ else }}Search... (Ctrl+K){{ end }}" autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>
</nav>

<main class="site-main">
  {{ block "main" . }}{{ end }}
</main>

<footer class="site-footer">
  © {{ now.Year }} InfraOps Router · Automated IT Infrastructure Content Platform
</footer>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    let searchIndex = null;

    // Load index on focus
    searchInput.addEventListener('focus', async () => {
      if (!searchIndex) {
        try {
          const langPrefix = '{{ if eq .Lang "zh" }}{{ else }}/en{{ end }}';
          const res = await fetch(langPrefix + '/index.json');
          searchIndex = await res.json();
        } catch (e) {
          console.error('Failed to load search index', e);
        }
      }
    });

    // Keyboard shortcut Ctrl+K
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape') {
        searchResults.classList.remove('active');
        searchInput.blur();
      }
    });

    // Close results on outside click
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.classList.remove('active');
      }
    });

    // Search logic
    searchInput.addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase().trim();
      if (!query || !searchIndex) {
        searchResults.classList.remove('active');
        return;
      }

      const results = searchIndex.filter(item => {
        return item.title.toLowerCase().includes(query) || 
               item.summary.toLowerCase().includes(query) ||
               (item.category && item.category.toLowerCase().includes(query));
      }).slice(0, 8); // Top 8 results

      searchResults.innerHTML = '';
      if (results.length === 0) {
        searchResults.innerHTML = '<div class="search-empty">{{ if eq .Lang "zh" }}未找到相关文章{{ else }}No results found{{ end }}</div>';
      } else {
        results.forEach(item => {
          const a = document.createElement('a');
          a.href = item.permalink;
          a.className = 'search-result-item';
          a.innerHTML = `
            <div class="search-result-title">${item.title}</div>
            <div class="search-result-summary">${item.summary}</div>
          `;
          searchResults.appendChild(a);
        });
      }
      searchResults.classList.add('active');
    });
  });
</script>
</body>
</html>
